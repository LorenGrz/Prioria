AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Prioria backend — stateless: Cognito for login, a Bedrock-backed Lambda
  that classifies a notification and pushes it via FCM in the same request,
  a second Bedrock Lambda that distills "Entrenar" chat rules, and Polly TTS.
  No DynamoDB, no SQS — notifications/rules/preferences all live on-device.
  Deployed to the user's own AWS account — do not reuse the
  permissions-boundary ARN from any workshop/sandbox account.

Globals:
  Function:
    Timeout: 15
    MemorySize: 256
    Runtime: nodejs24.x
    Architectures: [arm64]
    Tracing: Active
    Environment:
      Variables:
        BEDROCK_MODEL_ID: !Ref BedrockModelId
        POWERTOOLS_SERVICE_NAME: prioria

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
  BedrockModelId:
    Type: String
    Default: us.anthropic.claude-haiku-4-5-20251001-v1:0
    Description: Bedrock model used by the Strands agent to score/classify notifications.
  FcmServiceAccountSecretArn:
    Type: String
    Description: >
      ARN of the Secrets Manager secret holding the Firebase service-account
      JSON used to sign FCM HTTP v1 requests. Create this out-of-band
      (`aws secretsmanager create-secret ...`) before deploying — it is not
      managed by this template so the key never has to touch source control.
  FcmProjectId:
    Type: String
    Description: Firebase project ID that owns the service account above.

Resources:
  # ---------------------------------------------------------------------
  # Auth — Cognito is the source of truth for credentials, and the only
  # thing this backend persists at all. We never see or store a raw
  # password: sign-up/sign-in happens against the User Pool directly from
  # the RN app (SRP), and API Gateway validates the resulting JWT. Email is
  # both the username and the login "key" per spec.
  # ---------------------------------------------------------------------
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub prioria-${Stage}
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      MfaConfiguration: 'OPTIONAL'
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 7
      Schema:
        - Name: email
          Required: true
          Mutable: true
      DeletionProtection: ACTIVE

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub prioria-mobile-${Stage}
      GenerateSecret: false # public client (mobile app), SRP-based auth
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days

  # ---------------------------------------------------------------------
  # API
  # ---------------------------------------------------------------------
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      # CORS only matters for browser clients (the RN app isn't subject to
      # it) — scoped to the landing page's origin instead of '*' as
      # defense-in-depth, since nothing legitimate calls this from a browser
      # today.
      CorsConfiguration:
        AllowOrigins: ['https://lorengrz.github.io']
        AllowHeaders: [Authorization, Content-Type]
        AllowMethods: [GET, POST, PUT, DELETE, OPTIONS]
      # No usage plan/WAF in front of this API — these are the only ceiling
      # on abuse (e.g. a leaked/brute-forced JWT spamming /notifications or
      # /train to run up the Bedrock/Polly bill). Sized well above real
      # single-user traffic, well below what makes automated abuse cheap.
      DefaultRouteSettings:
        ThrottlingBurstLimit: 40
        ThrottlingRateLimit: 20
      Auth:
        Authorizers:
          CognitoAuthorizer:
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience: [!Ref UserPoolClient]
            IdentitySource: $request.header.Authorization
        DefaultAuthorizer: CognitoAuthorizer

  # ---------------------------------------------------------------------
  # Functions — agents (Python — the Strands Agents SDK is Python-native).
  # Same pattern as LorenGrz/simple-agent: a Strands Agent backed by a
  # Bedrock model, invoked directly (no reused permissions-boundary ARN
  # from any workshop account — this stack defines its own IAM roles).
  # ---------------------------------------------------------------------

  # Classifies a notification synchronously (Bedrock) and, if it clears the
  # caller-supplied threshold, pushes it via FCM inline — stateless, no
  # DynamoDB/SQS. The client sends its own current preferences/active
  # rules/fcmToken with every request instead of the backend looking them
  # up from a per-user row.
  ClassifyNotificationFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: classify.handler
      CodeUri: src/agent/
      Runtime: python3.13
      Timeout: 25
      MemorySize: 512
      Policies:
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
              Resource: '*'
            - Effect: Allow
              Action: [secretsmanager:GetSecretValue]
              Resource: !Ref FcmServiceAccountSecretArn
      Environment:
        Variables:
          FCM_SERVICE_ACCOUNT_SECRET_ARN: !Ref FcmServiceAccountSecretArn
          FCM_PROJECT_ID: !Ref FcmProjectId
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /notifications
            Method: POST

  # Backs the "Entrenar" chat: turns a free-text message into a distilled
  # rule and hands it straight back — the client persists it locally.
  TrainAgentFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: train.handler
      CodeUri: src/agent/
      Runtime: python3.13
      Timeout: 20
      MemorySize: 512
      Policies:
        - Statement:
            - Effect: Allow
              Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
              Resource: '*'
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /train
            Method: POST

  # ---------------------------------------------------------------------
  # Function — voice (Polly)
  # ---------------------------------------------------------------------
  SynthesizeVoiceFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: node24
        EntryPoints: [src/handlers/voice/synthesize.js]
    Properties:
      Handler: src/handlers/voice/synthesize.handler
      CodeUri: .
      Timeout: 20
      Policies:
        - Statement:
            - Effect: Allow
              Action: [polly:SynthesizeSpeech]
              Resource: '*'
        - S3CrudPolicy: { BucketName: !Ref VoiceClipsBucket }
      Environment:
        Variables:
          VOICE_CLIPS_BUCKET: !Ref VoiceClipsBucket
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /voice/synthesize
            Method: POST

  VoiceClipsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub prioria-voice-clips-${Stage}-${AWS::AccountId}
      LifecycleConfiguration:
        Rules:
          - Id: expire-clips
            Status: Enabled
            ExpirationInDays: 7
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

Outputs:
  ApiUrl:
    Description: Base URL for the HTTP API
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  VoiceClipsBucketName:
    Value: !Ref VoiceClipsBucket
