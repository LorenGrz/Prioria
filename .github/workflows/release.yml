name: Build & Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK via EAS (cloud)
        timeout-minutes: 60
        run: |
          # --json: EAS writes progress to stderr (visible in logs), final JSON to stdout
          eas build \
            --platform android \
            --profile preview \
            --non-interactive \
            --wait \
            --json \
            --no-auto-submit \
            > /tmp/eas_build.json
          echo "=== EAS Build JSON ==="
          cat /tmp/eas_build.json

      - name: Download APK from EAS
        run: |
          BUILD_URL=$(python3 -c "
          import json, sys
          with open('/tmp/eas_build.json') as f:
            content = f.read().strip()
          if not content:
            print('ERROR: eas_build.json is empty', file=sys.stderr)
            sys.exit(1)
          data = json.loads(content)
          builds = data if isinstance(data, list) else [data]
          url = builds[0].get('artifacts', {}).get('buildUrl') or builds[0].get('buildUrl', '')
          if not url:
            print('ERROR: no buildUrl in JSON:', json.dumps(builds[0], indent=2), file=sys.stderr)
            sys.exit(1)
          print(url)
          ")
          echo "Downloading from: $BUILD_URL"
          curl -L -o prioria.apk "$BUILD_URL"
          ls -lh prioria.apk

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v$(date +'%Y.%m.%d')-$(git rev-parse --short HEAD)"
          gh release create "$VERSION" prioria.apk \
            --title "Prioria $VERSION" \
            --notes "Build automático desde commit \`$(git rev-parse --short HEAD)\`" \
            --latest
