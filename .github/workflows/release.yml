name: Build & Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create android/local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Create .env for Metro bundler
        env:
          APP_ENV: ${{ secrets.APP_ENV }}
        run: echo "$APP_ENV" > .env

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon \
            -PversionCode=${{ github.run_number }} \
            -PversionName=1.0.${{ github.run_number }}
        timeout-minutes: 45

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk prioria.apk
          ls -lh prioria.apk
          VERSION="v1.0.${{ github.run_number }}"
          gh release create "$VERSION" prioria.apk \
            --title "Prioria $VERSION" \
            --notes "Build automático desde commit \`$(git rev-parse --short HEAD)\`" \
            --latest
